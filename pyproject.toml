[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kenya-mcp-hub"
version = "0.1.0"
description = "Registry and CLI for East Africa Model Context Protocol servers"
license = {text = "MIT"}
keywords = ["kenya","mcp","east-africa","ai-agents","registry"]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
kenya-mcp-hub = "kenya_mcp_hub.cli:main"

[project.urls]
Homepage = "https://github.com/gabrielmahia/kenya-mcp-hub"
Documentation = "https://github.com/gabrielmahia/nairobi-stack"
"MCP Registry" = "https://registry.modelcontextprotocol.io"
Datasets = "https://huggingface.co/gmahia"
Evaluation = "https://github.com/gabrielmahia/kipimo"
